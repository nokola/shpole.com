# Fly.io configuration for Shpole
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'shpole'
primary_region = 'lax'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  DATABASE_PATH = '/app/data/shpole.db'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = 'shpole_data'
  destination = '/app/data'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
